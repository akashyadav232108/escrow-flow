# Copy to application-local.yaml and adjust credentials.
spring:
  datasource:
    url: ${DB_URL}
    username: ${USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  wallet:
    starting-balance: 10000
