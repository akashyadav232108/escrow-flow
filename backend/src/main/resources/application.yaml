spring:
  application:
    name: escrow-flow

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 604800000  # 7 days for dev convenience (was 24h)
  wallet:
    starting-balance: 10000
  email:
    from: ${SENDER_MAIL:noreply@escrowflow.local}
    from-name: ${APP_NAME:Escrow Flow}
  otp:
    length: 6
    ttl-minutes: 10
    resend-cooldown-seconds: 60
    max-attempts: 5
  rate-limit:
    login-per-minute: 10
    signup-per-minute: 5
    send-otp-per-minute: 3

logging:
  level:
    root: INFO
    com.escrowflow: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
