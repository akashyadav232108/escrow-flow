spring:
  datasource:
    url: jdbc:h2:mem:escrow_flow_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: test-secret-key-must-be-at-least-32-characters-long
    expiration-ms: 3600000
  wallet:
    starting-balance: 10000
  email:
    from: test@escrowflow.local
    from-name: Escrow Flow Test
  otp:
    length: 6
    ttl-minutes: 10
    resend-cooldown-seconds: 60
    max-attempts: 5
  rate-limit:
    login-per-minute: 100
    signup-per-minute: 100
    send-otp-per-minute: 100
